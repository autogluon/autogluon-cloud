name: Release Tests

# Slow and expensive: runs every foundation model in the registry on its default instance (CPU and GPU).
# Trigger manually before a release.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test_release:
    strategy:
      fail-fast: false
      matrix:
        module: [tabular, timeseries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test Release
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: ${{ matrix.module }}
          marker: release
  cleanup_cloud_endpoints:
    # Tests delete their own endpoints, but a failed or cancelled job can leak one that bills forever.
    if: ${{ always() }}
    needs: test_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::369469875935:role/AutoGluonCloudCIRole
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: Delete Leaked Endpoints
        run: |
          python3 -m pip install boto3
          python3 ./.github/workflow_scripts/cleanup_endpoints.py '${{ github.run_id }}'
