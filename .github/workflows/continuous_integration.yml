name: Continuous Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "59 10 * * *"  # 2 hrs after the nightly image build workflow
  push:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write  # For commenting the docs preview link on PRs

defaults:
  run:
    shell: bash

jobs:
  cloud_lint_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Ruff Format Check
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "src tests"
      - name: Ruff Lint Check
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "src tests"
  test_general_cloud:
    # Fork PRs cannot assume the CI role, so skip instead of failing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["1.5.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Test General Cloud
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: general
          ag_version: '${{ matrix.AG_VERSION }}'
  test_tabular_cloud:
    # Fork PRs cannot assume the CI role, so skip instead of failing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["1.5.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Test Tabular Cloud
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: tabular
          ag_version: '${{ matrix.AG_VERSION }}'
  test_text_cloud:
    if: false
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["source", "1.2.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Test Text Cloud
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: text
          ag_version: '${{ matrix.AG_VERSION }}'
  test_image_cloud:
    if: false
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["source", "1.2.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Test Image Cloud
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: image
          ag_version: '${{ matrix.AG_VERSION }}'
  test_multimodal_cloud:
    if: false
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["source", "1.2.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Test Multimodal Cloud
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: multimodal
          ag_version: '${{ matrix.AG_VERSION }}'
  test_timeseries_cloud:
    # Fork PRs cannot assume the CI role, so skip instead of failing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["1.5.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Test Timeseries Cloud
        if: steps.changes.outputs.other_than_docs == 'true'
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: timeseries
          ag_version: '${{ matrix.AG_VERSION }}'
  test_cluster:
    if: false
    strategy:
      fail-fast: false
      matrix:
        AG_VERSION: ["source", "1.2.0"]
    needs: cloud_lint_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check if changes beside docs
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            other_than_docs:
              - '!(docs/**)**'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::369469875935:role/CloudCluster
          role-duration-seconds: 7200
          aws-region: us-east-1
      - name: Test Cluster
        if: steps.changes.outputs.other_than_docs == 'true'
        run: |
          chmod +x ./.github/workflow_scripts/test_cluster.sh
          ./.github/workflow_scripts/test_cluster.sh '${{ matrix.AG_VERSION }}'
  build_doc:
    # Fork PRs cannot assume the doc role or comment on the PR, so skip instead of failing.
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [test_general_cloud, test_tabular_cloud, test_timeseries_cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Env Vars
        uses: ./.github/actions/setup-env-vars
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::369469875935:role/AutoGluonCloudCIDocRole
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: Build Doc(For push)
        if: ${{ github.event_name == 'push' }}
        run: |
          chmod +x ./.github/workflow_scripts/build_doc.sh
          ./.github/workflow_scripts/build_doc.sh '${{ github.ref }}' '${{ github.repository }}' '${{ env.SHORT_SHA }}'
      - name: Build Doc(For pull request)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          branch: ${{ github.event.pull_request.head.ref }}
        run: |
          chmod +x ./.github/workflow_scripts/build_doc.sh
          ./.github/workflow_scripts/build_doc.sh "$branch" '${{ github.event.pull_request.head.repo.full_name }}' '${{ env.SHORT_SHA }}' PR-'${{ github.event.number }}'
      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Job PR-${{ github.event.number }}-${{ env.SHORT_SHA }} is done.
            Docs are uploaded to https://d12sc05jpx1wj5.cloudfront.net/PR-${{ github.event.number }}/${{ env.SHORT_SHA }}/index.html