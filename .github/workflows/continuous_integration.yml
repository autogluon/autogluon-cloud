name: Continuous Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "59 10 * * *"
  push:
    # Branches with an open PR are covered by the pull_request trigger; running
    # both would launch the SageMaker jobs twice per commit. Tags still build
    # versioned docs, and a branches filter alone would exclude them.
    branches:
      - master
      - stable
    tags:
      - 'v*'
  pull_request:

concurrency:
  # Cancel superseded commits for the same PR without mixing PRs, refs, or trigger types.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write  # For commenting the docs preview link on PRs

defaults:
  run:
    shell: bash

jobs:
  changes:
    # PRs that touch none of the `code` paths below (e.g. docs or README only) skip lint and the SageMaker tests.
    # Pushes, tags, schedules and manual runs always run them.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Check if code changed
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'
              - 'setup.py'
  cloud_lint_check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "src tests"
      - name: Ruff Lint Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "src tests"
  test_general_cloud:
    # Fork PRs cannot assume the CI role, so skip instead of failing.
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, cloud_lint_check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test General Cloud
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: general
  test_tabular_cloud:
    # Fork PRs cannot assume the CI role, so skip instead of failing.
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, cloud_lint_check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test Tabular Cloud
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: tabular
  test_timeseries_cloud:
    # Fork PRs cannot assume the CI role, so skip instead of failing.
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, cloud_lint_check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test Timeseries Cloud
        uses: ./.github/actions/test-cloud
        with:
          submodule-to-test: timeseries
  cleanup_cloud_endpoints:
    # Tests delete their own endpoints, but a failed or cancelled job can leak one that bills forever.
    # always() also runs this when the run is cancelled by a newer push.
    if: ${{ always() && needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, test_tabular_cloud, test_timeseries_cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::369469875935:role/AutoGluonCloudCIRole
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: Delete Leaked Endpoints
        run: |
          python3 -m pip install boto3
          python3 ./.github/workflow_scripts/cleanup_endpoints.py '${{ github.run_id }}'
  build_doc:
    # Fork PRs cannot assume the doc role or comment on the PR, so skip instead of failing.
    # !cancelled() lets docs-only PRs build docs even though lint and tests were skipped; failures still block.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, cloud_lint_check, test_general_cloud, test_tabular_cloud, test_timeseries_cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Env Vars
        uses: ./.github/actions/setup-env-vars
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::369469875935:role/AutoGluonCloudCIDocRole
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: Build Doc(For push)
        if: ${{ github.event_name == 'push' }}
        run: |
          chmod +x ./.github/workflow_scripts/build_doc.sh
          ./.github/workflow_scripts/build_doc.sh '${{ github.ref }}' '${{ github.repository }}' '${{ env.SHORT_SHA }}'
      - name: Build Doc(For pull request)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          branch: ${{ github.event.pull_request.head.ref }}
        run: |
          chmod +x ./.github/workflow_scripts/build_doc.sh
          ./.github/workflow_scripts/build_doc.sh "$branch" '${{ github.event.pull_request.head.repo.full_name }}' '${{ env.SHORT_SHA }}' PR-'${{ github.event.number }}'
      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.number }}
          body: |
            Job PR-${{ github.event.number }}-${{ env.SHORT_SHA }} is done.
            Docs are uploaded to https://d12sc05jpx1wj5.cloudfront.net/PR-${{ github.event.number }}/${{ env.SHORT_SHA }}/index.html
