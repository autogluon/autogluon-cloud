[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77 for PEP 639 SPDX license expression support
build-backend = "setuptools.build_meta"

[project]
name = "autogluon.cloud"
description = "Train and deploy ML models in the cloud"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AutoGluon Community" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# version / dependencies / optional-dependencies stay dynamic and are owned by setup.py
# (so the RELEASE=1 -> clean version, else .dev0 logic keeps working).
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.urls]
Documentation = "https://auto.gluon.ai/cloud"
"Bug Reports" = "https://github.com/autogluon/autogluon-cloud/issues"
Source = "https://github.com/autogluon/autogluon-cloud/"
"Contribute!" = "https://github.com/autogluon/autogluon-cloud/blob/master/CONTRIBUTING.md"

[project.scripts]
autogluon-cloud = "autogluon.cloud.cli:main"

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
per-file-ignores = {"*/__init__.py" = ["F401"]}

[tool.ruff.lint.isort]
known-first-party = ["autogluon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
xfail_strict = true
