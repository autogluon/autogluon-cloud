[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77 for PEP 639 SPDX license expression support
build-backend = "setuptools.build_meta"

[project]
name = "autogluon.cloud"
description = "Train and deploy ML models in the cloud"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AutoGluon Community" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# version stays dynamic and is owned by setup.py (so the RELEASE=1 -> clean
# version, else .dev0 logic keeps working).
dynamic = ["version"]
dependencies = [
    # common module provides utils with stable api across minor version
    "autogluon.common>=0.7,<1.6",
    # <2 because unlikely to introduce breaking changes in minor releases. >=1.10 because 1.10 is 3 years old, no need to support older
    "boto3>=1.10,<2",
    "packaging>=23.0,<27",
    "sagemaker>=2.126.0,<3",
    "pyarrow>=19.0.1,<25",  # lower bound to avoid https://github.com/apache/arrow/issues/45283
    "PyYAML~=6.0",
    "Pillow>=10.2,<13",
    "huggingface_hub>=0.20,<2",
    "typing_extensions>=4.0,<5",
    # CLI dependencies (autogluon-cloud command)
    "click>=8.0,<9",
    "rich>=13.0,<15",
]

[project.optional-dependencies]
ray = ["ray[default]>=2.10.0,<2.56"]
all = [  # To allow user to pass ag objects
    "autogluon>=0.7,<1.6",
    "autogluon.cloud[ray]",
]
tests = [
    "pytest",
    "moto",
    "autogluon.common>=0.7",
]

[project.urls]
Documentation = "https://auto.gluon.ai/cloud"
"Bug Reports" = "https://github.com/autogluon/autogluon-cloud/issues"
Source = "https://github.com/autogluon/autogluon-cloud/"
"Contribute!" = "https://github.com/autogluon/autogluon-cloud/blob/master/CONTRIBUTING.md"

[project.scripts]
autogluon-cloud = "autogluon.cloud.cli:main"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"autogluon.cloud" = [
    "default_cluster_configs/*.yaml",
    "utils/autogluon_dlc.json",
    "templates/*.yaml",
]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
per-file-ignores = {"*/__init__.py" = ["F401"]}

[tool.ruff.lint.isort]
known-first-party = ["autogluon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
xfail_strict = true
